plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'change-flow'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.xerial:sqlite-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Facilitator tooling is test-only: never included in bootJar or normal startup.
tasks.register('prepareAcceptanceTool') {
    dependsOn tasks.named('testClasses')
    inputs.files(sourceSets.test.runtimeClasspath)
    outputs.file(layout.buildDirectory.file('acceptance/launcher.args'))
    doLast {
        def target = layout.buildDirectory.file('acceptance/launcher.args').get().asFile
        target.parentFile.mkdirs()
        def cp = sourceSets.test.runtimeClasspath.asPath.replace('\\', '\\\\').replace('"', '\\"')
        target.setText('--class-path\n"' + cp + '"\ncom.example.changeflow.controller.AcceptanceTool\n', 'UTF-8')
    }
}
