spring.application.name=change-flow

# The operator supplies an absolute local persistent file path; no in-memory fallback.
changeflow.database.path=${CHANGEFLOW_DB_PATH:}
changeflow.database.busy-timeout-ms=${CHANGEFLOW_SQLITE_BUSY_TIMEOUT_MS:5000}

# Executed at application startup only; validation belongs to T014.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Trust actual servlet TLS, not client-supplied Forwarded/X-Forwarded-* headers.
# TLS termination must use a secured upstream hop; plain HTTP is local-loopback only.
server.forward-headers-strategy=none
